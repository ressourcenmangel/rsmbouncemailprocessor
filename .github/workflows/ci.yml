name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Lint PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: Build/Scripts/runTests.sh -b docker -s composerUpdateMax -t 14.3 -p ${{ matrix.php }}
      - name: Lint
        run: Build/Scripts/runTests.sh -b docker -s lintPhp -p ${{ matrix.php }}

  tests:
    name: Tests TYPO3 ${{ matrix.typo3 }} / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        typo3: ['13.4', '14.3']
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: Build/Scripts/runTests.sh -b docker -s composerUpdateMax -t ${{ matrix.typo3 }} -p ${{ matrix.php }}
      - name: Unit tests
        run: Build/Scripts/runTests.sh -b docker -s unit -p ${{ matrix.php }}
      - name: Functional tests (SQLite)
        run: Build/Scripts/runTests.sh -b docker -s functional -p ${{ matrix.php }}

  databases:
    name: Functional tests on ${{ matrix.db }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: [mariadb, postgres]
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: Build/Scripts/runTests.sh -b docker -s composerUpdateMax -t 14.3 -p 8.3
      - name: Functional tests
        run: Build/Scripts/runTests.sh -b docker -s functional -d ${{ matrix.db }} -p 8.3
