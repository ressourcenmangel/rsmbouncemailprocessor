#ddev-silent-no-warn
# Drei Vhosts: Startseite, v13 und v14 (DDEV-Router terminiert TLS und spricht Port 80)
ServerName rsmbouncemailprocessor.ddev.site

<VirtualHost *:80>
    SetEnvIf X-Forwarded-Proto "https" HTTPS=on
    DocumentRoot /var/www/html
    <Directory "/var/www/html/">
        AllowOverride All
        Require all granted
    </Directory>
    ErrorLog /dev/stdout
    CustomLog ${APACHE_LOG_DIR}/access.log combined
    Alias "/phpstatus" "/var/www/phpstatus.php"
</VirtualHost>

<VirtualHost *:80>
    SetEnvIf X-Forwarded-Proto "https" HTTPS=on
    DocumentRoot /var/www/html/v13/public
    ServerAlias v13.rsmbouncemailprocessor.ddev.site
    <Directory "/var/www/html/v13/">
        AllowOverride All
        Require all granted
    </Directory>
    ErrorLog /dev/stdout
    CustomLog ${APACHE_LOG_DIR}/access.log combined
    Alias "/phpstatus" "/var/www/phpstatus.php"
</VirtualHost>

<VirtualHost *:80>
    SetEnvIf X-Forwarded-Proto "https" HTTPS=on
    DocumentRoot /var/www/html/v14/public
    ServerAlias v14.rsmbouncemailprocessor.ddev.site
    <Directory "/var/www/html/v14/">
        AllowOverride All
        Require all granted
    </Directory>
    ErrorLog /dev/stdout
    CustomLog ${APACHE_LOG_DIR}/access.log combined
    Alias "/phpstatus" "/var/www/phpstatus.php"
</VirtualHost>
