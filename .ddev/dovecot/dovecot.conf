# Minimale Dovecot-2.4-Konfiguration fuer das lokale Bounce-Postfach (nur DDEV, nicht produktiv!)
# IMAP ohne TLS, Klartext-Login erlaubt, Benutzer aus BOUNCE_USER / BOUNCE_PASSWORD (Default bounce / bounce)
dovecot_config_version = 2.4.0
dovecot_storage_version = 2.4.0

protocols = imap
log_path = /dev/stderr
info_log_path = /dev/stderr

# Das Image kennt nur den Benutzer vmail
default_internal_user = vmail
default_internal_group = vmail
default_login_user = vmail

ssl = no
auth_allow_cleartext = yes
auth_mechanisms = plain login

mail_driver = maildir
mail_path = /srv/mail/%{user}/Maildir
mail_uid = vmail
mail_gid = vmail
first_valid_uid = 1000

namespace inbox {
  inbox = yes
  separator = /
}

# Benutzerdatei wird von docker-compose.dovecot.yaml aus BOUNCE_USER / BOUNCE_PASSWORD erzeugt
passdb passwd-file {
  passwd_file_path = /etc/dovecot/users
  default_password_scheme = PLAIN
}
userdb static {
  fields {
    uid = vmail
    gid = vmail
    home = /srv/mail/%{user}
  }
}

service imap-login {
  inet_listener imap {
    port = 143
  }
  inet_listener imaps {
    port = 0
  }
}
